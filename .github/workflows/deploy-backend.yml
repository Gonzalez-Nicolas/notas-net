name: Deploy backend

on:
  push:
    branches: [main]
    paths: [backend/**, .github/workflows/deploy-backend.yml]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build image in Azure Container Registry
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "notasnet-api:${{ github.sha }}" \
            backend
      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/notasnet-api:${{ github.sha }}"
