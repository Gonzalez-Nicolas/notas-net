name: Deploy backend

# Se ejecuta cuando el CI de main termina bien. Queda omitido (no rojo) hasta que
# se configure la variable de repositorio ACR_NAME (ver docs/deploy.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.ACR_NAME != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build image in Azure Container Registry
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "notasnet-api:${{ github.event.workflow_run.head_sha || github.sha }}" \
            backend
      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/notasnet-api:${{ github.event.workflow_run.head_sha || github.sha }}"
